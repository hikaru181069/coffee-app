name: Test

# on: 「いつ実行するか」のトリガー設定
# main への push と、main への pull request が作られたときに実行する
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── FastAPI（推薦エンジン）のユニットテスト ─────────────────────────
  fastapi-tests:
    runs-on: ubuntu-latest # GitHubが用意するUbuntuの仮想マシン上で実行する

    steps:
      # 1. リポジトリのコードをこの仮想マシンにコピーしてくる
      - uses: actions/checkout@v4

      # 2. Pythonをセットアップする
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 3. 依存ライブラリをインストールする。
      # 2026-09、Docker本番化に伴いrequirements.txtを本番用のみへ絞ったため、
      # pytest等のテスト専用ツールを含むrequirements-dev.txt（requirements.txt
      # を土台にする）を使う。
      - name: Install dependencies
        run: pip install -r fastapi-service/requirements-dev.txt

      # 4. テストを実行する
      - name: Run pytest
        run: cd fastapi-service && pytest -v

  # ── Backend（Express）のユニットテスト ───────────────────────────────
  # mongodb-memory-server（インメモリDB）をテストコード側で起動するため、
  # このワークフロー側でMongoDBのサービスコンテナ等は用意していない。
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: cd backend && npm ci

      # 2026-09、backendのutils/models/repositories層をTypeScript化した際に追加。
      # tsconfig.jsonのallowJs: true・checkJs: falseにより、.jsファイルは
      # 対象外のまま.tsファイルだけを型チェックする（tsc --noEmit）
      - name: Type check
        run: cd backend && npm run typecheck

      - name: Run tests
        run: cd backend && npm test

  # ── フロントエンドのlint・テスト・ビルド確認 ─────────────────────────
  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Lint
        run: cd frontend && npm run lint

      - name: Run tests
        run: cd frontend && npm test

      - name: Build
        run: cd frontend && npm run build
