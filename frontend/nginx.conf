# 本番用コンテナ（frontend/Dockerfileのprodステージ）でビルド済みの
# 静的ファイル（dist/）を配信するためのnginx設定。
#
# React Router（クライアントサイドルーティング）を使っているため、
# 「/records/123」のような実在しないファイルパスへ直接アクセス・
# リロードされても、常にindex.htmlを返してReact側にルーティングを
# 任せる必要がある（try_files のフォールバック）。これは現在Vercelへの
# デプロイで使っている`vercel.json`のrewriteルールと同じ意図をnginx用に
# 書き直したもの。
#
# 2026-09、「nginxをリバースプロキシとして本格的に使いたい」という
# 要望を受け、/api/へのリクエストをbackendコンテナへ転送する設定を
# 追加した。これにより、ブラウザから見るとfrontend・backendが同じ
# オリジン（1つのURL）に見える。フロントのJS（services/api/httpClient.js）
# が組み立てるURLは元々`${API_URL}${path}`という形で、`path`は常に
# `/api/...`から始まる。docker-compose.prod.ymlでVITE_API_URLを空文字に
# するだけで、ビルド時にAPI_URLが空になり、結果としてfetchのURLが
# `/api/...`という「今開いているページと同じ場所」宛の相対パスになる
# （コード自体の変更は不要）。
#
# 2026-09（追記）: k6の負荷テストでVU100〜140あたりからレイテンシが
# 悪化することが分かったため、backendを3台（backend1/2/3、
# docker-compose.prod.yml参照）に増やし、ここでロードバランシングする
# ようにした。serverを複数書くだけで、nginxは既定でラウンドロビン
# （順番に振り分ける）方式を使う。重み付け等の特別な設定はしていない
# （3台とも全く同じスペックのため不要）。
# 2026-10-05（追記2）: 静的upstreamブロックの構造的な限界が2つ見つかった
# ため、resolverディレクティブ+変数化proxy_pass方式へ置き換えた
# （IMPLEMENTATION.md該当エントリ参照）。
#
# 限界(1) IPが変わっても再解決しない: nginxの静的upstreamは起動時に
#   1度だけDNS解決し、以降キャッシュし続ける。backendコンテナを作り
#   直すとIPが変わり、nginxが古いIPへ接続し続けて失敗する
#   （2026-09-29に発見、`docker compose restart frontend`で回避していた）。
# 限界(2) 1台でも解決できないと起動自体に失敗する: upstream内の
#   サーバー名のどれか1つでも起動時にDNS解決できないと、nginxは
#   `host not found in upstream`でクラッシュループする。backendを
#   メンテナンスで止めている間にfrontendの再作成が重なると、本来
#   「backendが足りないだけ」のはずが「全トラフィック停止」という
#   より深刻な障害になる（2026-10-05、障害実験中に発見）。
#
# 解決策: backend1/2/3にDocker Compose側で共通のネットワークエイリアス
# `backend-pool`を付与する（docker-compose.prod.yml参照）。Dockerの
# 内部DNS(127.0.0.11)は、このエイリアスを引くたびに「今実際に起動して
# いるコンテナ」のIPだけを返す（落ちているコンテナは自動的に除外される）。
# nginx側はresolverディレクティブでこのDNSを使い、proxy_passを変数化
# することで「起動時に1回だけ」ではなく「リクエストのたびに(valid秒
# ごとに)引き直す」動作にする。これにより限界(1)(2)を両方解消した。
#
# トレードオフ: 静的upstreamが持っていたmax_fails/fail_timeout
# （直近失敗したサーバーを一時的に避ける、2026-10-05に追加した
# 原始的なサーキットブレーカー）は、この方式とは併用できない
# （nginx OSSの制約。動的DNS解決と配下サーバーの障害追跡の両立は
# nginx Plusの有料機能`server ... resolve`が必要）。「コンテナごと
# 落ちている」場合はDocker DNSが自動的に除外するため実害は小さいが、
# 「コンテナは生きているがアプリ層だけ壊れている」場合は知らずに
# 踏みに行く可能性が残る。そこは引き続き短いproxy_connect_timeout
# （下記）で被害を抑える方針にする。
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /api/で始まるリクエストは、静的ファイルとして探さずbackendへそのまま
    # 転送する（パスは書き換えない。backend側もapp.jsで/api/...を前提に
    # ルーティングしているため一致する）。
    location /api/ {
        # 変数に入れてからproxy_passへ渡すのが、resolverディレクティブで
        # 動的解決させるための必須の書き方（$backend_poolのように変数化
        # しないと、従来通り起動時の1回きりの解決に戻ってしまう）。
        set $backend_pool http://backend-pool:5001;
        proxy_pass $backend_pool;
        proxy_http_version 1.1;
        # backend側（app.jsのcorsミドルウェア・ログ等）が、ブラウザから
        # 直接来たリクエストと同じ情報を見られるよう、元のホスト名・
        # 送信元IPをヘッダーで伝える（nginxが間に入ったことを隠さない）。
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 2026-10-05、フェイルファスト対応（IMPLEMENTATION.md参照）。
        # proxy_connect_timeoutの既定値は60秒だが、今回問題にしている
        # 「死んだコンテナへの接続」はDockerブリッジネットワーク内で
        # 完結するため、実際のクラウド環境（AZ間・リージョン間）より
        # ずっと短い時間で失敗が判明するはず、という前提で短く設定する。
        # 1台あたり2秒に制限することで、「死んでいるサーバーに当たった
        # 人が無駄に長く待たされる」被害を圧縮する。
        proxy_connect_timeout 2s;

        # 全アップストリームへのリトライ合計時間の上限（タイムアウト予算）。
        # 3台構成でも「2秒 × 3台 = 6秒」が最悪ケースの上限になるよう、
        # 5秒で打ち切ってnginx自身に502を返させる。待ち続けて結局
        # 成功させるより、一定時間で見切りをつけた方が、過負荷時に
        # みんなが延々と待たされる連鎖を防げる（Timeout Budgetの考え方）。
        proxy_next_upstream_timeout 5s;
    }

    # 実在するファイル・ディレクトリはそのまま返し、無ければindex.htmlへ
    # フォールバックする（SPAのクライアントサイドルーティング対応）。
    #
    # 2026-09、リバースプロキシ化の動作確認中に発覚した不具合の修正:
    # index.htmlにCache-Controlを何も指定していなかったため、ブラウザが
    # 「明示的な指定が無いHTML」をヒューリスティックにキャッシュし、
    # 新しいビルド（＝ファイル名にハッシュが変わった新しいJS/CSS）を
    # デプロイしても、ブラウザが古いindex.html（古いハッシュ名を参照した
    # まま）を使い続けてしまい、結果として古いJSが動き続ける現象が
    # 実機（新規タブでの検証）で再現した。index.html自体は「常に
    # 最新を見に行き、変わっていなければサーバー側が304を返す」という
    # 挙動にする（no-cacheは「保存はするが必ず再検証する」という意味で、
    # no-storeとは異なる）。ハッシュ付きファイル名を持つ/assets/配下は
    # 下のブロックの通り引き続き長期キャッシュしてよい。
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # JS/CSS/画像/フォントはファイル名にハッシュが含まれビルドごとに
    # 変わるため、長期間キャッシュしてよい（immutable）。
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Dockerのヘルスチェック用。index.htmlの内容を返すだけで十分軽量。
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
