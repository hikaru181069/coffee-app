# 本番用コンテナ（frontend/Dockerfileのprodステージ）でビルド済みの
# 静的ファイル（dist/）を配信するためのnginx設定。
#
# React Router（クライアントサイドルーティング）を使っているため、
# 「/records/123」のような実在しないファイルパスへ直接アクセス・
# リロードされても、常にindex.htmlを返してReact側にルーティングを
# 任せる必要がある（try_files のフォールバック）。これは現在Vercelへの
# デプロイで使っている`vercel.json`のrewriteルールと同じ意図をnginx用に
# 書き直したもの。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 実在するファイル・ディレクトリはそのまま返し、無ければindex.htmlへ
    # フォールバックする（SPAのクライアントサイドルーティング対応）。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # JS/CSS/画像/フォントはファイル名にハッシュが含まれビルドごとに
    # 変わるため、長期間キャッシュしてよい（immutable）。
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Dockerのヘルスチェック用。index.htmlの内容を返すだけで十分軽量。
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
