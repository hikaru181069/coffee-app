# 本番用コンテナ（frontend/Dockerfileのprodステージ）でビルド済みの
# 静的ファイル（dist/）を配信するためのnginx設定。
#
# React Router（クライアントサイドルーティング）を使っているため、
# 「/records/123」のような実在しないファイルパスへ直接アクセス・
# リロードされても、常にindex.htmlを返してReact側にルーティングを
# 任せる必要がある（try_files のフォールバック）。これは現在Vercelへの
# デプロイで使っている`vercel.json`のrewriteルールと同じ意図をnginx用に
# 書き直したもの。
#
# 2026-09、「nginxをリバースプロキシとして本格的に使いたい」という
# 要望を受け、/api/へのリクエストをbackendコンテナへ転送する設定を
# 追加した。これにより、ブラウザから見るとfrontend・backendが同じ
# オリジン（1つのURL）に見える。フロントのJS（services/api/httpClient.js）
# が組み立てるURLは元々`${API_URL}${path}`という形で、`path`は常に
# `/api/...`から始まる。docker-compose.prod.ymlでVITE_API_URLを空文字に
# するだけで、ビルド時にAPI_URLが空になり、結果としてfetchのURLが
# `/api/...`という「今開いているページと同じ場所」宛の相対パスになる
# （コード自体の変更は不要）。
upstream backend {
    server backend:5001;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /api/で始まるリクエストは、静的ファイルとして探さずbackendへそのまま
    # 転送する（パスは書き換えない。backend側もapp.jsで/api/...を前提に
    # ルーティングしているため一致する）。
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        # backend側（app.jsのcorsミドルウェア・ログ等）が、ブラウザから
        # 直接来たリクエストと同じ情報を見られるよう、元のホスト名・
        # 送信元IPをヘッダーで伝える（nginxが間に入ったことを隠さない）。
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 実在するファイル・ディレクトリはそのまま返し、無ければindex.htmlへ
    # フォールバックする（SPAのクライアントサイドルーティング対応）。
    #
    # 2026-09、リバースプロキシ化の動作確認中に発覚した不具合の修正:
    # index.htmlにCache-Controlを何も指定していなかったため、ブラウザが
    # 「明示的な指定が無いHTML」をヒューリスティックにキャッシュし、
    # 新しいビルド（＝ファイル名にハッシュが変わった新しいJS/CSS）を
    # デプロイしても、ブラウザが古いindex.html（古いハッシュ名を参照した
    # まま）を使い続けてしまい、結果として古いJSが動き続ける現象が
    # 実機（新規タブでの検証）で再現した。index.html自体は「常に
    # 最新を見に行き、変わっていなければサーバー側が304を返す」という
    # 挙動にする（no-cacheは「保存はするが必ず再検証する」という意味で、
    # no-storeとは異なる）。ハッシュ付きファイル名を持つ/assets/配下は
    # 下のブロックの通り引き続き長期キャッシュしてよい。
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # JS/CSS/画像/フォントはファイル名にハッシュが含まれビルドごとに
    # 変わるため、長期間キャッシュしてよい（immutable）。
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Dockerのヘルスチェック用。index.htmlの内容を返すだけで十分軽量。
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
