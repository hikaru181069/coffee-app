services:
  mongodb:
    image: mongo:8.0
    container_name: coffee-app-mongodb
    ports:
      # mlb-appのmongodbコンテナがホスト側27017を使用中のため、別番号を割り当てる
      # (コンテナ内部は27017のまま。コンテナ間通信はサービス名で行うため影響なし)
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db

  fastapi:
    # 2026-09、Dockerfileをmulti-stage化（開発用/本番用の2ステージ）した
    # ため、開発用のtargetを明示する（docker-compose.prod.ymlはtarget: prod）。
    build:
      context: ./fastapi-service
      target: dev
    container_name: coffee-app-fastapi
    ports:
      # mlb-appのfastapiコンテナがホスト側8000を使用中のため、別番号を割り当てる
      - "8001:8000"
    volumes:
      - ./fastapi-service:/app

  backend:
    build:
      context: ./backend
      target: dev
    container_name: coffee-app-backend
    ports:
      # mlb-appのbackendコンテナがホスト側5001を使用中のため、別番号を割り当てる
      - "5002:5001"
    volumes:
      - ./backend:/app
      # 匿名volume: コンテナ内でnpm installした node_modules を、
      # 上の行(ホストのソースコード全体)で上書きされないように保護する。
      # ホスト側に node_modules が無くても(あってもOSが違っても)問題なく動く。
      - /app/node_modules
    environment:
      # ここでのホスト名(mongodb, fastapi)は docker-compose.yml 内の
      # サービス名。Docker Composeが内部ネットワークで名前解決してくれるため、
      # localhost ではなくサービス名で他のコンテナに到達できる。
      PORT: 5001
      MONGO_URI: mongodb://mongodb:27017/coffeeApp
      FASTAPI_URL: http://fastapi:8000
      FRONTEND_URL: http://localhost:5174
      # ローカル開発専用の値。本番のJWT_SECRETとは無関係(ローカルMongoは
      # ユーザーデータも空なので、値が一致している必要はない)。
      JWT_SECRET: local-dev-secret-change-me
    depends_on:
      - mongodb
      - fastapi

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: coffee-app-frontend
    ports:
      # mlb-appのfrontendコンテナがホスト側5173を使用中のため、別番号を割り当てる
      - "5174:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      # 注意: これはブラウザ(ホストPC側)から呼ばれるURLなので、
      # コンテナ名(backend)ではなく localhost を指定する。
      # Viteはビルド時にこの値をJSに埋め込み、そのJSは手元のブラウザで
      # 実行される＝Dockerの内部ネットワークの外側から呼ばれるため。
      # ホスト側ポートを5002へ変更したため、ここも合わせる。
      VITE_API_URL: http://localhost:5002
    depends_on:
      - backend

  # 2026-09、backend・fastapiの/metricsをスクレイピングするために追加
  # （monitoring/prometheus/prometheus.yml参照）。設定ファイルは本番相当
  # （docker-compose.prod.yml）と共用している。
  prometheus:
    image: prom/prometheus:v3.9.1
    container_name: coffee-app-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend
      - fastapi

  # 2026-09、Prometheusが集めたメトリクスを見るためのダッシュボード。
  # データソース・ダッシュボード（monitoring/grafana/provisioning/）を
  # 起動時に自動で読み込むため、手動でのGUI設定は不要
  # （http://localhost:3000 を開いてログインするだけでよい）。
  grafana:
    image: grafana/grafana-oss:13.0.2
    container_name: coffee-app-grafana
    ports:
      - "3000:3000"
    volumes:
      # ダッシュボードの手動編集・ユーザー設定等、Grafana自身が持つ状態
      # （SQLite）を永続化する（mongodb_dataと同じ考え方）。
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      # ローカル開発専用の値（JWT_SECRETの開発用値と同じ扱い）。
      # 本番相当（docker-compose.prod.yml）では必須の環境変数として
      # 個別に設定させる。
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus

volumes:
  mongodb_data:
  grafana_data:
