# 本番相当の動き方をローカルで再現するための司令書。
#
# 2026-09、AWS本番リリースに向けたDocker仕上げの一環で新設した。
# 既存のdocker-compose.yml（開発用、ホットリロード・bind mount）は
# 一切変更せず、こちらは別ファイルとして完全に独立している。
#
# 使い方:
#   1. リポジトリ直下に .env.prod を作る（.env.prod.exampleをコピーして
#      JWT_SECRETを自分の値に書き換える）
#   2. docker compose -f docker-compose.prod.yml --env-file .env.prod up --build
#
# 各サービスのDockerfileの `target: prod` ステージ（本番用の作り方）を使う。
# mongodb・fastapiはコンテナ同士の通信だけで使うため、ホストPCへポートを
# 公開しない（本番でDBを外部公開しないのと同じ考え方をローカル再現でも
# 踏襲する）。
#
# 2026-09、frontend（nginx）を「静的ファイル配信専用」から「/api/を
# backendへ転送するリバースプロキシ」へ格上げした（frontend/nginx.confの
# コメント参照）。ブラウザはfrontendの1箇所だけを見ればよくなったため、
# backendのポートもmongodb・fastapiと同じくホストへ公開しない。
#
# `name:` でCompose上のプロジェクト名を明示的に分けている。これを省略すると
# 両ファイルとも「ディレクトリ名(coffee-app)」を既定のプロジェクト名として
# 使ってしまい、開発用（docker-compose.yml）と同じプロジェクト扱いになる。
# その状態でこちらを`up`すると、container_nameで名前を分けていても、
# Composeは「project=coffee-app, service=backend」のような同じ組み合わせを
# 同一サービスの再デプロイと解釈し、動いていた開発用コンテナを問答無用で
# 削除してから作り直してしまう（実機検証で実際に発生を確認した不具合）。
# `name:`で別プロジェクト（コンテナ・ネットワーク・状態管理が別枠）に
# することで、開発用と本番用を同時に安全に併存させられる。
name: coffee-app-prod

services:
  mongodb:
    image: mongo:8.0
    container_name: coffee-app-mongodb-prod
    volumes:
      - mongodb_prod_data:/data/db
    restart: unless-stopped

  fastapi:
    build:
      context: ./fastapi-service
      target: prod
    # dev用のdocker-compose.ymlも同じサービス名（fastapi/backend/frontend）
    # を使っているため、image名を明示しないとdevとprodのビルドが同じタグを
    # 取り合ってしまう（後からビルドした方が上書きする）。:prodサフィックス
    # で明確に分ける。
    image: coffee-app-fastapi:prod
    container_name: coffee-app-fastapi-prod
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: prod
    image: coffee-app-backend:prod
    container_name: coffee-app-backend-prod
    # ブラウザはfrontend（nginx）経由でしかbackendを呼ばなくなったため、
    # ホストへポートを公開しない（コンテナ間通信のみ。上のコメント参照）。
    environment:
      PORT: 5001
      MONGO_URI: mongodb://mongodb:27017/coffeeApp
      FASTAPI_URL: http://fastapi:8000
      FRONTEND_URL: http://localhost:8080
      # ${JWT_SECRET:?...} は「JWT_SECRETが渡されていなければ即エラーで
      # 止める」という書き方。開発用のようにファイルへ値を直書きしない。
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required. Copy .env.prod.example to .env.prod and set it.}
    depends_on:
      - mongodb
      - fastapi
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        # 2026-09、nginxがリバースプロキシとして/api/をbackendへ転送する
        # ようになったため、空文字にする。frontend/utils/apiConfig.jsの
        # API_URLが空になり、fetchのURLが「今開いているページと同じ場所」
        # 宛の相対パス（/api/...）になる。以前はbackendの公開ポートを
        # 直接指定していたが、そのポート自体を公開しなくなったため不要に
        # なった（frontend/nginx.confのコメント参照）。
        VITE_API_URL: ""
    image: coffee-app-frontend:prod
    container_name: coffee-app-frontend-prod
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  # 2026-09、backend・fastapiの/metricsをスクレイピングするために追加
  # （monitoring/prometheus/prometheus.yml参照。開発用docker-compose.yml
  # と設定ファイルを共用している）。実際のAWS本番では、9090番を
  # そのままインターネットへ公開することはせず、VPN経由・内部限定の
  # ALB・Amazon Managed Service for Prometheus等を使う想定（現時点では
  # 未着手、IMPLEMENTATION.md参照）。ここではローカルで本番相当の動きを
  # 再現し、実際に自分のブラウザから確認できるようにするため公開する。
  prometheus:
    image: prom/prometheus:v3.9.1
    container_name: coffee-app-prometheus-prod
    # 開発用docker-compose.ymlのprometheusサービスのコメント参照
    # （k6の負荷テスト結果をリアルタイムに受け取るためのフラグ）。
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-remote-write-receiver"
    ports:
      # 開発用（docker-compose.yml）のPrometheusが既にホスト側9090番を
      # 使っているため、他のサービス（backend/frontend等）と同じ理由で
      # 別番号を割り当てる（コンテナ内部は9090のまま）。
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend
      - fastapi
    restart: unless-stopped

  # データソース・ダッシュボードは開発用と同じprovisioning設定を共用する
  # （monitoring/grafana/provisioning/参照）。
  grafana:
    image: grafana/grafana-oss:13.0.2
    container_name: coffee-app-grafana-prod
    ports:
      # 開発用（docker-compose.yml）のGrafanaが既にホスト側3000番を
      # 使っているため、Prometheusと同じ理由で別番号を割り当てる。
      - "3001:3000"
    volumes:
      - grafana_prod_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      # JWT_SECRETと同じ書き方: 値が渡されていなければ即エラーで止める
      # （開発用のように値を直書きしない）。
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required. Copy .env.prod.example to .env.prod and set it.}
    depends_on:
      - prometheus
    restart: unless-stopped

  # 開発用docker-compose.ymlのk6サービスのコメント参照（常駐しない、
  # profilesで`up`の対象から外している）。
  #
  # 実行方法:
  #   docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm k6 run -o experimental-prometheus-rw /scripts/smoke-test.js
  #
  # BASE_URLは開発用と違い、backendへ直接ではなくfrontend（nginxの
  # リバースプロキシ）経由にしている。実際のブラウザが叩く経路と同じに
  # することで、nginxを挟んだ分のオーバーヘッドも含めて計測するため。
  k6:
    image: grafana/k6:2.3.0
    container_name: coffee-app-k6-prod
    profiles: ["load-test"]
    volumes:
      - ./monitoring/k6/scripts:/scripts:ro
    environment:
      BASE_URL: http://frontend/api
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
    depends_on:
      - frontend
      - prometheus

volumes:
  mongodb_prod_data:
  grafana_prod_data:
