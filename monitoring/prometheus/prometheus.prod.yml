# Prometheusの設定ファイル（本番相当・docker-compose.prod.yml専用）。
#
# 開発用（prometheus.yml）との違いは"backend"ジョブのtargetsのみ
# （backend:5001の1台 → backend1/2/3の3台）。backendをロードバランシング
# 構成にしたことに合わせた（docker-compose.prod.ymlのコメント参照）。
# job_nameは開発用と揃えているため、Grafanaのダッシュボード側
# （job="backend"で問い合わせる）は変更不要。3台それぞれのメトリクスが
# 同じjobの下にinstanceラベル違いとして集まる。

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend1:5001", "backend2:5001", "backend3:5001"]

  - job_name: "fastapi"
    metrics_path: /metrics
    static_configs:
      - targets: ["fastapi:8000"]
