# Prometheusの設定ファイル（開発用docker-compose.yml専用）。
#
# 2026-09、本番相当（docker-compose.prod.yml）がbackendを3レプリカ
# 構成にロードバランシングしたことで、スクレイピング対象のホスト名が
# 開発用（backend:5001の1台）と異なってしまったため、
# prometheus.prod.ymlへ分離した（docker-compose.yml/docker-compose.prod.yml
# が既に別ファイルなのと同じ考え方）。job_name（"backend"等）は両ファイルで
# 揃えているため、Grafanaのダッシュボード側（job="backend"で問い合わせる）
# は変更不要。
#
# スクレイピング対象のホスト名（backend, fastapi）はDocker Composeの
# サービス名。Prometheus自身も同じdocker composeネットワークの中で
# 動くため、コンテナ名で他のコンテナへ到達できる
# （docker-compose.yml内のbackendサービスのコメントと同じ理由）。

global:
  scrape_interval: 15s

scrape_configs:
  # Prometheus自身の状態（スクレイピングの成功・失敗等）も見えるようにする
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:5001"]

  - job_name: "fastapi"
    metrics_path: /metrics
    static_configs:
      - targets: ["fastapi:8000"]
